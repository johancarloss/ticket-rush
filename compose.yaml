name: ticket-rush

services:
  traefik:
    image: traefik:v3.7.13
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ticket-rush_edge
      - --entrypoints.web.address=:80
      # Keycloak admin console, published only on 127.0.0.1 (issue #3)
      - --entrypoints.admin.address=:8085
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      # Metrics on a separate entrypoint that is not published, so only Prometheus reaches them
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true
      # Each request starts a trace here; traceparent is forwarded to the Guard and to the services
      - --tracing.serviceName=traefik
      - --tracing.otlp.http.endpoint=http://jaeger:4318/v1/traces
    ports:
      - "${TRAEFIK_HTTP_PORT:-8180}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8181}:8080"
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8185}:8085"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - edge
      - observability
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ticketrush
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      CHECKOUT_DB_PASSWORD: ${CHECKOUT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      STATS_DB_PASSWORD: ${STATS_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ticketrush"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    # AOF keeps stream messages across restarts (ADR-006)
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_svc
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:${TRAEFIK_HTTP_PORT:-8180}/auth
      # The admin console builds its links with this address, which is only reachable from the machine itself
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT:-8185}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_TEST_USERS_PASSWORD: ${KC_TEST_USERS_PASSWORD}
    volumes:
      - ./infra/keycloak/ticket-rush-realm.json:/opt/keycloak/data/import/ticket-rush-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - data
    labels:
      - traefik.enable=true
      # Public: login, tokens and public keys of the ticket-rush realm
      - traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)
      - traefik.http.routers.keycloak.entrypoints=web
      - traefik.http.routers.keycloak.service=keycloak
      # Admin console and the master realm (where the admin logs in) answer 403 on the public entrypoint
      - traefik.http.routers.keycloak-admin-blocked.rule=PathPrefix(`/auth/admin`) || PathPrefix(`/auth/realms/master`)
      - traefik.http.routers.keycloak-admin-blocked.entrypoints=web
      - traefik.http.routers.keycloak-admin-blocked.priority=100
      - traefik.http.routers.keycloak-admin-blocked.middlewares=deny-all@file
      - traefik.http.routers.keycloak-admin-blocked.service=keycloak
      # The whole Keycloak on the admin entrypoint, published only on 127.0.0.1
      - traefik.http.routers.keycloak-admin.rule=PathPrefix(`/auth`)
      - traefik.http.routers.keycloak-admin.entrypoints=admin
      - traefik.http.routers.keycloak-admin.service=keycloak
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    healthcheck:
      # The image has no curl; bash opens a TCP socket to the management port instead
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  guard:
    build: ./services/guard
    image: ticket-rush/guard:dev
    environment:
      # Keys are fetched over the internal network; the issuer is the public address Keycloak writes in the token
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/ticket-rush/protocol/openid-connect/certs
      TOKEN_ISSUER: http://localhost:${TRAEFIK_HTTP_PORT:-8180}/auth/realms/ticket-rush
      TOKEN_AUDIENCE: ticket-rush-api
      # Purchase requests per second per account (ADR-002); counters live in Redis so both replicas share them
      RATE_LIMIT_PER_SECOND: ${GUARD_RATE_LIMIT_PER_SECOND:-10}
      REDIS_ADDR: redis:6379
      OTEL_SERVICE_NAME: guard
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    deploy:
      # Two replicas so purchases keep working if one of them dies (ADR-002, fail-closed)
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
      - observability
    healthcheck:
      test: ["CMD", "/guard", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Temporary route to exercise the Guard end to end until the real services exist.
  # traefik/whoami echoes back the request it received, including the headers set by the middlewares.
  whoami:
    image: traefik/whoami:v1.11.0
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=PathPrefix(`/api/whoami`)
      - traefik.http.routers.whoami.entrypoints=web
      - traefik.http.routers.whoami.middlewares=buyer-auth@file
      - traefik.http.services.whoami.loadbalancer.server.port=80

  # Observability (ADR-010). The three panels are published only on 127.0.0.1, like the Traefik dashboard.
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-8183}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  jaeger:
    # Jaeger v2 is built on the OpenTelemetry Collector and receives OTLP directly (4317 gRPC, 4318 HTTP).
    # The all-in-one image keeps traces in memory, which is enough for test runs.
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-8184}:16686"
    networks:
      - observability

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-8182}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  edge:
  data:
  observability:

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
