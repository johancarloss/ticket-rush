# Checks shared by every TypeScript service. Called from ci.yml with the service folder and image name.
name: TypeScript service

on:
  workflow_call:
    inputs:
      path:
        description: Service folder, for example services/inventory
        required: true
        type: string
      image:
        description: Image name used for the test build
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Node version comes from "engines.node" in the service's package.json
          node-version-file: ${{ inputs.path }}/package.json
          cache: npm
          cache-dependency-path: ${{ inputs.path }}/package-lock.json
      - name: Install (exactly what the lockfile says)
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Tests
        run: npm test
      - name: Known vulnerabilities
        run: npm audit --audit-level=high
      - name: Docker image
        run: docker build -t "ticket-rush/${{ inputs.image }}:ci" .
