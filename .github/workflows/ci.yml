name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # Lists the services touched by the PR, so a change in one service does not rerun every other one.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.diff.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ci-changed-services.sh "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"

  # One block per service. Go services use go-service.yml, TypeScript services use ts-service.yml.
  guard:
    name: Guard (Go)
    needs: changes
    if: contains(needs.changes.outputs.services, ' guard ')
    uses: ./.github/workflows/go-service.yml
    with:
      path: services/guard
      image: guard

  # Load bots and test-account tool; they run from another machine, so there is no image to build.
  bots:
    name: Bots (Go)
    needs: changes
    if: contains(needs.changes.outputs.services, ' bots ')
    uses: ./.github/workflows/go-service.yml
    with:
      path: bots

  stats:
    name: Stats (Go)
    needs: changes
    if: contains(needs.changes.outputs.services, ' stats ')
    uses: ./.github/workflows/go-service.yml
    with:
      path: services/stats
      image: stats

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Local links
        run: ./scripts/check-doc-links.sh
