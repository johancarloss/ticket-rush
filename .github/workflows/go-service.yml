# Checks shared by every Go service. Called from ci.yml with the service folder and image name.
name: Go service

on:
  workflow_call:
    inputs:
      path:
        description: Service folder, for example services/guard
        required: true
        type: string
      image:
        description: Image name used for the test build
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      # Actions are pinned to a commit hash: a tag can be moved to point at different code, a hash cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Go version comes from the toolchain line of each service's go.mod
          go-version-file: ${{ inputs.path }}/go.mod
          cache-dependency-path: ${{ inputs.path }}/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Docker image
        # Tools that run outside Compose (the load bots) have no image
        if: inputs.image != ''
        run: docker build -t "ticket-rush/${{ inputs.image }}:ci" .
