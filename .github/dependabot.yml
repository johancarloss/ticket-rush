version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/guard
    schedule:
      interval: weekly
    # Wait two weeks after a release before proposing it; security updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(guard)"

  - package-ecosystem: docker
    directory: /services/guard
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(guard)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(ci)"
